services:
  web:
    build: .
    container_name: festival-3d-music
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - LASTFM_USER=${LASTFM_USER}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-60}
    restart: unless-stopped
